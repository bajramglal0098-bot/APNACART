<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ApnaCart</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #ff6b00;
      color: white;
      padding: 18px;
      text-align: center;
    }

    header h1 {
      font-size: 28px;
    }

    header p {
      margin-top: 5px;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 20px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }

    .product {
      background: white;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 2px 8px #ddd;
      text-align: center;
    }

    .product .photo {
      height: 130px;
      background: #eee;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 50px;
      margin-bottom: 12px;
    }

    .product h3 {
      margin-bottom: 8px;
    }

    .price {
      color: #ff6b00;
      font-weight: bold;
      font-size: 20px;
      margin-bottom: 10px;
    }

    button {
      background: #ff6b00;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #e65f00;
    }

    .cart {
      background: white;
      margin-top: 25px;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px #ddd;
    }

    .cart h2 {
      margin-bottom: 15px;
    }

    #cartItems {
      margin-bottom: 15px;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #ddd;
    }

    .total {
      font-size: 22px;
      font-weight: bold;
      margin: 15px 0;
    }

    .empty {
      color: #777;
    }
  </style>
</head>

<body>

  <header>
    <h1>🛒 ApnaCart</h1>
    <p>Apni shopping, apne ghar tak</p>
  </header>

  <div class="container">

    <h2>🛍️ Products</h2>

    <div class="products">

      <div class="product">
        <div class="photo">👕</div>
        <h3>T-Shirt</h3>
        <div class="price">₹499</div>
        <button onclick="addToCart('T-Shirt', 499)">
          Add to Cart
        </button>
      </div>

      <div class="product">
        <div class="photo">👟</div>
        <h3>Shoes</h3>
        <div class="price">₹999</div>
        <button onclick="addToCart('Shoes', 999)">
          Add to Cart
        </button>
      </div>

      <div class="product">
        <div class="photo">🎒</div>
        <h3>Bag</h3>
        <div class="price">₹699</div>
        <button onclick="addToCart('Bag', 699)">
          Add to Cart
        </button>
      </div>

      <div class="product">
        <div class="photo">⌚</div>
        <h3>Watch</h3>
        <div class="price">₹799</div>
        <button onclick="addToCart('Watch', 799)">
          Add to Cart
        </button>
      </div>

    </div>

    <div class="cart">
      <h2>🛒 Your Cart</h2>

      <div id="cartItems">
        <p class="empty">Cart abhi khaali hai.</p>
      </div>

      <div class="total">
        Total: ₹<span id="total">0</span>
      </div>

      <button onclick="placeOrder()">
        📦 Order Now
      </button>
    </div>

  </div>

  <script>
    let cart = [];
function searchProducts() {
  const search = document.getElementById("searchBox").value.toLowerCase();
  const products = document.querySelectorAll(".product");

  products.forEach(product => {
    const name = product.querySelector("h3").innerText.toLowerCase();

    if (name.includes(search)) {
      product.style.display = "";
    } else {
      product.style.display = "none";
    }
  });
}
    function addToCart(name, price) {
      cart.push({
        name: name,
        price: Number(price)
      });

      showCart();
    }

    function showCart() {
      const cartItems = document.getElementById("cartItems");
      const totalElement = document.getElementById("total");

      cartItems.innerHTML = "";

      if (cart.length === 0) {
        cartItems.innerHTML =
          '<p class="empty">Cart abhi khaali hai.</p>';

        totalElement.innerText = "0";
        return;
      }

      let total = 0;

      cart.forEach((item, index) => {
        total += item.price;

        const div = document.createElement("div");
        div.className = "cart-item";

        div.innerHTML = `
          <span>${item.name} - ₹${item.price}</span>
          <button onclick="removeItem(${index})">
            Remove
          </button>
        `;

        cartItems.appendChild(div);
      });

      totalElement.innerText = total;
    }

    function removeItem(index) {
      cart.splice(index, 1);
      showCart();
    }

 function placeOrder() {
  if (cart.length === 0) {
    alert("Pehle product cart mein add karein.");
    return;
  }

  let name = prompt("Apna naam likhiye:");
  if (!name) return;

  let mobile = prompt("Apna mobile number likhiye:");
  if (!mobile) return;

  let address = prompt("Delivery address likhiye:");
  if (!address) return;

  let items = cart
    .map(item => item.name + " - ₹" + item.price)
    .join("\n");

  let total = cart.reduce(
    (sum, item) => sum + item.price,
    0
  );

  let message =
    "🛒 ApnaCart Order\n\n" +
    "Naam: " + name + "\n" +
    "Mobile: " + mobile + "\n" +
    "Address: " + address + "\n\n" +
    "Products:\n" + items +
    "\n\nTotal: ₹" + total;

  let whatsappNumber = "919468882106";

  let url =
    "https://wa.me/" +
    whatsappNumber +
    "?text=" +
    encodeURIComponent(message);

  window.open(url, "_blank");
}  
  </script>

</body>
</html>
